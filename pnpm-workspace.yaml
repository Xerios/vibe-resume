packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
patchedDependencies:
  loro-codemirror: patches/loro-codemirror.patch
# One version of each package shared between workspace packages. CodeMirror in
# particular breaks with two copies: a second @codemirror/state is rejected
# outright, and a second @lezer/highlight silently stops tags matching.
catalog:
  '@codemirror/autocomplete': ^6.20.3
  '@codemirror/language': ^6.12.4
  '@codemirror/state': ^6.7.5
  '@codemirror/view': ^6.43.12
  '@lezer/highlight': ^1.2.3
  marked: ^18.0.13
  svelte: ^5.57.0
  vite: ^8.3.0
