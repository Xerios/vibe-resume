server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# adapter-static's fallback: routing is handled client-side.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Hashed and immutable: safe to cache forever.
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Re-fetched by the service worker on every visit — must never come from a
	# stale cache, or a new deploy can never be discovered.
	location = /service-worker.js {
		add_header Cache-Control "no-cache";
	}

	location = /index.html {
		add_header Cache-Control "no-cache";
	}
}
